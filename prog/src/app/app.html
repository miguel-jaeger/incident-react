<!-- Fixed Header -->
<header class="fixed top-0 left-0 right-0 z-50 bg-surface-container-lowest shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
  <div class="h-16 w-full px-space-lg flex items-center justify-between gap-space-md">
    <div class="flex items-center gap-space-md">
      <div class="flex items-center gap-space-sm">
        <img
          alt="Universidad Tecnológica del Perú"
          class="h-9 w-auto object-contain"
          src="https://upload.wikimedia.org/wikipedia/commons/5/50/Utplogonuevo.svg?utm_source=es.wikipedia.org&amp;utm_campaign=index&amp;utm_content=original"
        />
        <div class="flex flex-col">
          <span class="font-headline-sm text-headline-sm text-primary tracking-tight">UTP Incidentes TI</span>
          <span class="font-label-sm text-label-sm text-on-surface-variant leading-none">Gestión Campus &amp; Infraestructura</span>
        </div>
      </div>
    </div>
    <div class="flex items-center gap-space-md">
      <button
        aria-label="Notificaciones urgentes"
        class="relative p-2 rounded-full text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low transition-colors"
        type="button"
      >
        <span class="material-symbols-outlined text-xl">notifications</span>
        <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-error ring-2 ring-surface-container-lowest"></span>
      </button>
      <div class="flex items-center gap-space-sm pl-space-sm">
        <div class="hidden sm:flex flex-col text-right">
          <span class="font-label-sm text-label-sm text-on-surface font-semibold">{{ user?.name || 'Admin TI UTP' }}</span>
          <span class="font-label-sm text-label-sm text-outline leading-none">{{ user?.role || 'Supervisión NOC' }}</span>
        </div>
        <img
          alt="Profile"
          class="w-8 h-8 rounded-full object-cover"
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuA7ri6QyBan5kvQoXffWSwQbWtpq11tvmL9zWOKsEQkkfkdPZwxVVTM4IzPpVO8K6BpVfiFy7U92VnmAFgdYzOIPGKO_0jbBBKQspQ2IG4TWidKi5N6JUAS-Uv7IY-M7_zGJk_FOkUQjC25vMRGtIRjcf31iInSNvU1RvJ5iBOI2M-59PvhTw26CeFGKhqXV438jppB75DcIFm781rkXvks3SERqXE1XaXHDh5ekp4"
        />
        <button
          *ngIf="user"
          aria-label="Cerrar sesión"
          class="p-2 rounded-full text-on-surface-variant hover:text-error hover:bg-error-container/50 transition-colors"
          title="Cerrar sesión"
          (click)="logout()"
          type="button"
        >
          <span class="material-symbols-outlined text-xl">logout</span>
        </button>
      </div>
    </div>
  </div>
  <!-- Accent hairline -->
  <div class="h-0.5 w-full bg-gradient-to-r from-primary via-secondary to-tertiary opacity-80"></div>
</header>

<!-- Main Container -->
<main class="w-full pt-16 bg-background min-h-screen flex flex-col justify-between">
  <div class="flex flex-col w-full flex-grow">
    <!-- Rutas del feature (lazy loaded) -->
    <router-outlet></router-outlet>
  </div>

  <!-- Institutional Footer -->
  <footer class="w-full bg-surface-container-lowest shadow-[0_-1px_6px_rgba(0,0,0,0.03)] mt-auto">
    <div class="w-full px-space-lg py-space-xl flex flex-col md:flex-row items-center justify-between gap-space-md">
      <div class="flex flex-col sm:flex-row items-center gap-space-md text-center sm:text-left">
        <div class="flex items-center gap-space-sm">
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/5/50/Utplogonuevo.svg?utm_source=es.wikipedia.org&amp;utm_campaign=index&amp;utm_content=original"
            alt="UTP Logo"
            class="h-8 w-auto object-contain"
          />
          <div class="flex flex-col text-left">
            <span class="font-headline-sm text-headline-sm text-primary tracking-tight font-bold">UTP Incidentes TI</span>
            <span class="font-label-sm text-label-sm text-on-surface-variant leading-none">Gestión Campus &amp; Infraestructura</span>
          </div>
        </div>
        <span class="font-body-sm text-body-sm text-on-surface-variant">© 2025&nbsp; Plataforma de Infraestructura &amp; Gestión de Incidentes TI.</span>
      </div>
      <div class="flex flex-wrap items-center justify-center gap-space-lg">
        <a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors" href="#">Mesa de Ayuda UTP</a>
        <a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors" href="#">Soporte de Red</a>
        <a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors" href="#">Estado de Servidores</a>
      </div>
    </div>
  </footer>
</main>

<!-- Toast global (servido por ToastService) -->
<app-toast></app-toast>
